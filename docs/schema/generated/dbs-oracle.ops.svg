<circle cx="368.0" cy="282.5" r="2.5" fill="#147887"/><circle cx="628.0" cy="282.5" r="2.5" fill="#147887"/>
<rect x="368.0" y="294.0" width="260.0" height="23.0" fill="#f8fafc" stroke="#e5eaf0" stroke-width="0.6"/>
<text x="374.0" y="309.0" font-family="ui-monospace, monospace" font-size="7.5" font-weight="700" fill="#64748b">UQ</text>
