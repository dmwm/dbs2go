<text x="378.0" y="261.0" font-family="system-ui, sans-serif" font-size="9.5" fill="#53657a">PK PK_MR · +8 folded</text>
<rect x="368.0" y="271.0" width="260.0" height="23.0" fill="#ffffff" stroke="#e5eaf0" stroke-width="0.6"/>
<text x="374.0" y="286.0" font-family="ui-monospace, monospace" font-size="7.5" font-weight="700" fill="#64748b">PK NN</text>
<text x="426.0" y="286.0" font-family="ui-monospace, monospace" font-size="9.0" font-weight="600" fill="#172b4d">MIGRATION_REQUEST_ID</text>
