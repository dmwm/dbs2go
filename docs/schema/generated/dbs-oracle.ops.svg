<text x="90.0" y="203.0" font-family="ui-monospace, monospace" font-size="9.0" font-weight="600" fill="#172b4d">MIGRATION_BLOCK_ID</text>
<text x="286.0" y="203.0" text-anchor="end" font-family="ui-monospace, monospace" font-size="7.5" fill="#52657a">INTEGER</text>
<circle cx="32.0" cy="199.5" r="2.5" fill="#147887"/><circle cx="292.0" cy="199.5" r="2.5" fill="#147887"/>
<rect x="32.0" y="211.0" width="260.0" height="23.0" fill="#f8fafc" stroke="#e5eaf0" stroke-width="0.6"/>
<text x="38.0" y="226.0" font-family="ui-monospace, monospace" font-size="7.5" font-weight="700" fill="#64748b">FK UQ NN</text>
<text x="90.0" y="226.0" font-family="ui-monospace, monospace" font-size="9.0" font-weight="600" fill="#172b4d">MIGRATION_REQUEST_ID</text>
<text x="286.0" y="226.0" text-anchor="end" font-family="ui-monospace, monospace" font-size="7.5" fill="#52657a">INTEGER</text>
<circle cx="32.0" cy="222.5" r="2.5" fill="#147887"/><circle cx="292.0" cy="222.5" r="2.5" fill="#147887"/>
<rect x="32.0" y="234.0" width="260.0" height="23.0" fill="#ffffff" stroke="#e5eaf0" stroke-width="0.6"/>
<text x="38.0" y="249.0" font-family="ui-monospace, monospace" font-size="7.5" font-weight="700" fill="#64748b">UQ</text>
<text x="90.0" y="249.0" font-family="ui-monospace, monospace" font-size="9.0" font-weight="600" fill="#172b4d">MIGRATION_BLOCK_NAME</text>
<text x="286.0" y="249.0" text-anchor="end" font-family="ui-monospace, monospace" font-size="7.5" fill="#52657a">VARCHAR2(700)</text>
<circle cx="32.0" cy="245.5" r="2.5" fill="#147887"/><circle cx="292.0" cy="245.5" r="2.5" fill="#147887"/>
</g>
<g id="table-MIGRATION_REQUESTS">
