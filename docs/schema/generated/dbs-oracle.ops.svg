<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 345" width="680" height="345" role="img" aria-labelledby="title desc">
<title id="title">DBS relational map — Migration and instance metadata</title>
<desc id="desc">DBS tables with exact foreign-key column connections, generated directly by the Go schema tool.</desc>
<defs><marker id="fk-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#147887"/></marker></defs>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="32" y="38" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#172b4d">Migration and instance metadata</text>
<text x="32" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#52657a">Migration requests and DBS schema/version metadata.</text>
<text x="32" y="78" font-family="system-ui, sans-serif" font-size="11" fill="#52657a">Exact arrows run from FK source columns to referenced PK/UQ columns.</text>
<rect x="32" y="92" width="12" height="12" rx="2" fill="#E6F5ED" stroke="#17734D"/><text x="50" y="103" font-family="system-ui, sans-serif" font-size="10" fill="#334155">Core</text>
<rect x="142" y="92" width="12" height="12" rx="2" fill="#E9F2FC" stroke="#245FA9"/><text x="160" y="103" font-family="system-ui, sans-serif" font-size="10" fill="#334155">Lookup</text>
<rect x="252" y="92" width="12" height="12" rx="2" fill="#F3EAFF" stroke="#7047AA"/><text x="270" y="103" font-family="system-ui, sans-serif" font-size="10" fill="#334155">Parentage</text>
<rect x="362" y="92" width="12" height="12" rx="2" fill="#FFF0DF" stroke="#AC5516"/><text x="380" y="103" font-family="system-ui, sans-serif" font-size="10" fill="#334155">Config</text>
<rect x="472" y="92" width="12" height="12" rx="2" fill="#E8F4F5" stroke="#147887"/><text x="490" y="103" font-family="system-ui, sans-serif" font-size="10" fill="#334155">Operations</text>
<rect x="582" y="92" width="12" height="12" rx="2" fill="#F1F3F5" stroke="#596675"/><text x="600" y="103" font-family="system-ui, sans-serif" font-size="10" fill="#334155">Other</text>
<text x="32" y="124" font-family="ui-monospace, monospace" font-size="10" fill="#52657a">PK primary key · FK foreign key · UQ unique · NN not null · +N folded columns are in the dictionary</text>
<path d="M 292.0 222.5 H 320.0 V 282.5 H 368.0" fill="none" stroke="#147887" stroke-width="1.6" opacity="0.82" marker-end="url(#fk-arrow)"/>
<rect x="296.0" y="212.5" width="68" height="20" rx="3" fill="#ffffff" opacity="0.94"/>
<text x="330.0" y="220.0" text-anchor="middle" font-family="ui-monospace, monospace" font-size="7.5" font-weight="700" fill="#147887"><tspan x="330.0">MR_MB</tspan><tspan x="330.0" dy="7.5" font-size="7" font-weight="500">CASCADE</tspan></text>
<g id="table-DBS_VERSIONS">
<rect x="368.0" y="142.0" width="260.0" height="69.0" rx="7" fill="#ffffff" stroke="#147887" stroke-width="1.4"/>
<path d="M 368.0 149.0 h 260.0 v 39.0 h -260.0 z" fill="#E8F4F5"/>
<text x="378.0" y="161.0" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#147887">DBS_VERSIONS</text>
<text x="378.0" y="178.0" font-family="system-ui, sans-serif" font-size="9.5" fill="#53657a">PK PK_DV · +6 folded</text>
<rect x="368.0" y="188.0" width="260.0" height="23.0" fill="#ffffff" stroke="#e5eaf0" stroke-width="0.6"/>
<text x="374.0" y="203.0" font-family="ui-monospace, monospace" font-size="7.5" font-weight="700" fill="#64748b">PK NN</text>
<text x="426.0" y="203.0" font-family="ui-monospace, monospace" font-size="9.0" font-weight="600" fill="#172b4d">DBS_VERSION_ID</text>
<text x="622.0" y="203.0" text-anchor="end" font-family="ui-monospace, monospace" font-size="7.5" fill="#52657a">INTEGER</text>
<circle cx="368.0" cy="199.5" r="2.5" fill="#147887"/><circle cx="628.0" cy="199.5" r="2.5" fill="#147887"/>
</g>
<g id="table-MIGRATION_BLOCKS">
